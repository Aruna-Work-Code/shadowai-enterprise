services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigovernance}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-aigovernance}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [governance]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WEBHOOK_HMAC_REQUIRED: ${WEBHOOK_HMAC_REQUIRED:-true}
      WEBHOOK_MAX_SKEW_SECONDS: ${WEBHOOK_MAX_SKEW_SECONDS:-300}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
    networks: [governance]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["5173:80"]
    networks: [governance]
networks: {governance: {}}
volumes: {pgdata: {}}
