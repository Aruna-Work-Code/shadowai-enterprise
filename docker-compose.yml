services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: aigovernance
      POSTGRES_USER: aigovernance
      POSTGRES_PASSWORD: aigovernance

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aigovernance -d aigovernance"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - governance-network


  backend:
    build:
      context: ./backend

    environment:
      DB_URL: jdbc:postgresql://db:5432/aigovernance
      DB_USERNAME: aigovernance
      DB_PASSWORD: aigovernance

      JWT_SECRET: change-this-before-production-to-a-long-random-secret

      CORS_ALLOWED_ORIGINS: http://localhost:5173

    ports:
      - "8080:8080"

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    networks:
      - governance-network


  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - governance-network


networks:

  governance-network:
    driver: bridge


volumes:

  pgdata: