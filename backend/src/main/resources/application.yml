spring:
  application:
    name: ai-governance-decision-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aigovernance}
    username: ${DB_USERNAME:aigovernance}
    password: ${DB_PASSWORD:aigovernance}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-that-is-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  webhook:
    hmac-required: ${WEBHOOK_HMAC_REQUIRED:false}
    max-skew-seconds: ${WEBHOOK_MAX_SKEW_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
